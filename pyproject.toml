[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "niche-finder"
version = "0.1.0"
description = "Niche & Product Opportunity Finder — a demand-discovery engine that scores niches on SEO + AIEO winnability and monetisation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Niche Finder" }]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "tenacity>=8.2",
    "rapidfuzz>=3.6",
    "pandas>=2.1",
    "jinja2>=3.1",
]

[project.optional-dependencies]
# Live data sources / LLM. Everything here is optional — without these the
# pipeline still runs end-to-end in fixture mode.
live = [
    "anthropic>=0.39",
    "pytrends>=4.9",
]
dashboard = [
    "streamlit>=1.33",
]
dev = [
    "pytest>=8.0",
    "respx>=0.21",
    "ruff>=0.4",
]

[project.scripts]
niche-finder = "niche_finder.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
niche_finder = ["storage/schema.sql"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # line length handled softly; many strings/prompts are long

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
