<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { display: flex; justify-content: center; align-items: center; min-height: 100vh; background: #0b0f14; }

  .post {
    position: relative;
    width: 1080px;
    height: 1080px;
    background: #141b23;
    overflow: hidden;
    font-family: "acumin-pro", sans-serif;
    color: #ffffff;
  }

  /* ---- background brand system ---- */
  .bg-rings { position: absolute; right: -260px; bottom: -300px; width: 900px; height: 900px; opacity: 0.5; }
  .bg-dots  { position: absolute; top: 150px; right: 70px; width: 230px; height: 230px; opacity: 0.5; }
  .watermark {
    position: absolute; left: 60px; bottom: 150px;
    font-family: "industry", sans-serif; font-weight: 900;
    font-size: 300px; line-height: 0.8; letter-spacing: -6px;
    color: transparent; -webkit-text-stroke: 2px rgba(255,255,255,0.05);
    text-stroke: 2px rgba(255,255,255,0.05);
    user-select: none; white-space: nowrap;
  }

  /* ---- top bar ---- */
  .topbar { position: absolute; top: 64px; left: 80px; right: 80px; display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 16px; }
  .brand .mark { width: 44px; height: 44px; }
  .brand .word { font-family: "acumin-pro", sans-serif; font-weight: 700; font-size: 30px; letter-spacing: -0.5px; color: #ffffff; }
  .brand .word b { color: #98f83d; font-weight: 700; }
  .eyebrow {
    font-family: "acumin-pro", sans-serif; font-weight: 700; font-size: 18px; letter-spacing: 3px;
    text-transform: uppercase; color: #98f83d;
    border: 1.5px solid rgba(152,248,61,0.45); border-radius: 100px; padding: 9px 18px;
  }

  /* ---- headline ---- */
  .headline {
    position: absolute; top: 210px; left: 80px; width: 940px;
    font-family: "industry", sans-serif; font-weight: 900;
    font-size: 138px; line-height: 0.9; letter-spacing: -2px;
    text-transform: uppercase; color: #ffffff;
  }
  .headline .hl { color: #98f83d; position: relative; display: inline-block; }
  .headline .hl::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 6px; height: 10px;
    background: #98f83d; opacity: 0.9; border-radius: 2px;
  }

  /* ---- stat chip ---- */
  .stat {
    position: absolute; top: 770px; left: 80px;
    display: inline-flex; align-items: center; gap: 14px;
    background: #98f83d; color: #141b23;
    font-family: "acumin-pro", sans-serif; font-weight: 700; font-size: 27px; letter-spacing: -0.3px;
    padding: 16px 26px 16px 22px; border-radius: 100px;
  }
  .stat svg { width: 26px; height: 26px; flex: none; }

  /* ---- sub copy ---- */
  .subcopy {
    position: absolute; top: 852px; left: 82px; width: 720px;
    font-family: "acumin-pro", sans-serif; font-weight: 400; font-size: 26px; line-height: 1.35;
    color: rgba(255,255,255,0.72);
  }
  .subcopy b { color: #ffffff; font-weight: 700; }

  /* ---- bottom strip ---- */
  .footer {
    position: absolute; left: 0; right: 0; bottom: 0; height: 96px;
    background: #ffffff; display: flex; align-items: center; justify-content: space-between;
    padding: 0 80px;
  }
  .footer .url { display: flex; align-items: center; gap: 14px; font-family: "acumin-pro", sans-serif; font-weight: 700; font-size: 30px; color: #141b23; letter-spacing: -0.3px; }
  .footer .url svg { width: 30px; height: 30px; }
  .footer .region {
    font-family: "acumin-pro", sans-serif; font-weight: 700; font-size: 18px; letter-spacing: 2px;
    text-transform: uppercase; color: #015af5;
    background: rgba(1,90,245,0.10); border-radius: 100px; padding: 9px 18px;
  }

  /* royal-blue accent bar tucked behind footer */
  .accent-bar { position: absolute; left: 0; bottom: 96px; width: 360px; height: 12px; background: #015af5; }
</style>
