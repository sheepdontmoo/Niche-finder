name: LinkedIn auto-poster

# Drips the queued remote1stjobs posts to LinkedIn on a schedule.
# No third-party services — runs on GitHub's own runners, posts via the LinkedIn REST API.

on:
  schedule:
    - cron: "17,47 * * * *"   # every 30 min (off the :00/:30 mark)
  workflow_dispatch:           # manual "Run workflow" button
    inputs:
      all_due:
        description: "Post every due item now (not just the next one)"
        type: boolean
        default: false

permissions:
  contents: write              # to commit the updated queue.json (posted flags)

concurrency:
  group: linkedin-poster
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Post next due item
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_AUTHOR_URN: ${{ secrets.LINKEDIN_AUTHOR_URN }}
        run: |
          if [ "${{ github.event.inputs.all_due }}" = "true" ]; then
            python linkedin-poster/post_to_linkedin.py --all-due
          else
            python linkedin-poster/post_to_linkedin.py
          fi

      - name: Commit posted state
        run: |
          if ! git diff --quiet -- linkedin-poster/queue.json; then
            git config user.name "linkedin-poster"
            git config user.email "actions@users.noreply.github.com"
            git add linkedin-poster/queue.json
            git commit -m "chore: mark LinkedIn post(s) as published [skip ci]"
            git push
          else
            echo "No queue changes to commit."
          fi
